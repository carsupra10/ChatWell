<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWell-Beta</title>
    <meta name="description" content="ChatWell-Beta: Connect with random chat partners in real-time.">
    <meta name="keywords" content="chat, random chat, real-time chat, ChatWell">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .message-sent {
            background-color: #DCF8C6;
            text-align: right;
        }

        .message-received {
            background-color: #FFFFFF;
            text-align: left;
        }

        .messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            background-color: #f7f7f7;
        }

        .header,
        .input {
            background-color: #ffffff;
            padding: 1rem;
        }

        .header {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            border-bottom: 1px solid #e5e5e5;
        }

        .input {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            border-top: 1px solid #e5e5e5;
            z-index: 10;
        }

        .content {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
    </style>
</head>

<body class="flex flex-col h-screen">

    <div class="header flex items-center justify-between">
        <h1 class="text-xl font-bold">ChatWell</h1>
        <div>
            <button id="findButton" class="bg-green-500 text-white p-2 rounded-lg">Find Partner</button>
            <button id="endButton" class="bg-red-500 text-white p-2 rounded-lg">End</button>
        </div>
    </div>

    <div class="content flex-grow flex flex-col">
        <div class="messages" id="messages"></div>
    </div>

    <div class="input flex items-center">
        <input id="messageInput" class="flex-1 p-2 border rounded-lg mr-2" type="text" placeholder="Type your message...">
        <button id="sendButton" class="bg-blue-500 text-white p-2 rounded-lg">Send</button>
    </div>

    <script>
        const socket = io();

        document.getElementById('sendButton').addEventListener('click', function () {
            sendMessage();
        });

        document.getElementById('endButton').addEventListener('click', function () {
            socket.emit('end');
            document.getElementById('messages').innerHTML = '';
        });

        document.getElementById('findButton').addEventListener('click', function () {
            socket.emit('find');
        });

        // Handle sending message when Enter key is pressed
        document.getElementById('messageInput').addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); // Prevent default behavior (like newline)
                sendMessage();
            }
        });

        socket.on('message', function (message) {
            addMessage('Partner', message, 'message-received');
        });

        socket.on('partnerDisconnected', function () {
            document.getElementById('messages').innerHTML = '<div class="text-center text-red-500">Partner has disconnected.</div>';
        });

        socket.on('timeout', function () {
            document.getElementById('messages').innerHTML = '<div class="text-center text-yellow-500">Connection timed out. Please find a new partner.</div>';
        });

        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            if (message.trim() !== '') {
                socket.emit('message', message);
                addMessage('You', message, 'message-sent');
                document.getElementById('messageInput').value = '';
            }
        }

        function addMessage(sender, message, cssClass) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('p-2', 'rounded-lg', 'my-2', cssClass);
            messageElement.innerText = `${sender}: ${message}`;
            document.getElementById('messages').appendChild(messageElement);
            scrollMessagesToBottom();
        }

        // Scroll messages to the bottom
        function scrollMessagesToBottom() {
            const messagesContainer = document.getElementById('messages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Ensure messages are scrolled to the bottom on new message
        const messagesContainer = document.getElementById('messages');
        const observer = new MutationObserver(() => {
            scrollMessagesToBottom();
        });
        observer.observe(messagesContainer, { childList: true });

        // Adjust input position with keyboard
        window.addEventListener('resize', () => {
            const messageInput = document.getElementById('messageInput');
            if (window.innerHeight < 500) { // Assumed keyboard is open
                messageInput.scrollIntoView({ behavior: 'smooth' });
            }
        });

        // Scroll messages to the bottom initially
        scrollMessagesToBottom();
    </script>
</body>

</html>
