<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatWell-Beta: Free Random Chat, Tamil Chat with Strangers</title>
    <link rel="icon" href="./icon.jpg">
    <meta name="description" content="ChatWell-Beta: Connect with random chat partners in real-time. Free chat with strangers, Tamil chat, anonymous conversations, and an alternative to Omegle.">
    <meta name="keywords" content="chat, random chat, real-time chat, ChatWell, Omegle alternative, Tamil chat, anonymous chat">
    <meta name="robots" content="index, follow">
    <meta name="msvalidate.01" content="5FF034E75151C0AE779D210F75A2401F" />
    <link rel="canonical" href="https://www.chatwell-beta.onrender.com/">
    <meta property="og:title" content="ChatWell-Beta: Free Random Chat, Tamil Chat with Strangers, Omegle Alternative">
    <meta property="og:description" content="ChatWell-Beta: Connect with random chat partners in real-time. Free chat with strangers, Tamil chat, anonymous conversations, and an alternative to Omegle.">
    <meta property="og:image" content="https://www.chatwell-beta.onrender.com/icon.jpg">
    <meta property="og:url" content="https://www.chatwell-beta.onrender.com/">
    <meta property="og:type" content="website">
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script type="application/ld+json">
    {
      "@context": "http://schema.org",
      "@type": "WebSite",
      "name": "ChatWell-Beta",
      "url": "https://www.chatwell-beta.onrender.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.chatwell-beta.onrender.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <style>
        .message-sent {
            background-color: #DCF8C6;
            text-align: right;
        }

        .message-received {
            background-color: #FFFFFF;
            text-align: left;
        }

        .messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            background-color: #f7f7f7;
        }

        .header,
        .input-wrapper {
            background-color: #ffffff;
            padding: 1rem;
            position: sticky;
            z-index: 10;
        }

        .header {
            top: 0;
            left: 0;
            right: 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .input-wrapper {
            position: relative;
            bottom: 0;
            left: 0;
            right: 0;
            border-top: 1px solid #e5e5e5;
        }

        .content {
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--safe-area-inset-bottom));
            overflow-y: auto;
        }

        .messages-container {
            overflow-y: auto;
            flex-grow: 1;
        }

        body {
            overflow-y: hidden;
        }

        /* Adjusted styles for slogan */
        .slogan {
            font-size: 1.5rem; /* Adjust size as needed */
            color: #6B7280; /* Adjust color as needed */
        }

        /* Hide slogan and footer on mobile and tablet screens */
        @media (max-width: 768px) {
            .hide-on-mobile {
                display: none;
            }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <div class="header flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold">ChatWell</h1>
            <h2 class="slogan hide-on-mobile">Free Random Chat, Tamil Chat with Strangers, Omegle Alternative</h2>
        </div>
        <div >
            <button id="findButton" class="bg-green-500 text-white p-2 rounded-lg">Find Partner</button>
            <button id="endButton" class="bg-red-500 text-white p-2 rounded-lg">End</button>
        </div>
    </div>

    <div class="messages-container">
        <div class="messages" id="messages"></div>
    </div>

    <div class="input-wrapper flex items-center">
        <input id="messageInput" class="flex-1 p-2 border rounded-lg mr-2" type="text" placeholder="Type your message...">
        <button id="sendButton" class="bg-blue-500 text-white p-2 rounded-lg">Send</button>
    </div>

    <script>
        const socket = io();

        document.getElementById('sendButton').addEventListener('click', function () {
            sendMessage();
        });

        document.getElementById('endButton').addEventListener('click', function () {
            socket.emit('end');
            document.getElementById('messages').innerHTML = '';
        });

        document.getElementById('findButton').addEventListener('click', function () {
            socket.emit('find');
        });

        // Handle sending message when Enter key is pressed
        document.getElementById('messageInput').addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); // Prevent default behavior (like newline)
                sendMessage();
            }
        });

        socket.on('message', function (message) {
            addMessage('Partner', message, 'message-received');
        });

        socket.on('partnerDisconnected', function () {
            document.getElementById('messages').innerHTML = '<div class="text-center text-red-500">Partner has disconnected.</div>';
        });

        socket.on('timeout', function () {
            document.getElementById('messages').innerHTML = '<div class="text-center text-yellow-500">Connection timed out. Please find a new partner.</div>';
        });

        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            if (message.trim() !== '') {
                socket.emit('message', message);
                addMessage('You', message, 'message-sent');
                document.getElementById('messageInput').value = '';
            }
        }

        function addMessage(sender, message, cssClass) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('p-2', 'rounded-lg', 'my-2', cssClass);
            messageElement.innerText = `${sender}: ${message}`;
            document.getElementById('messages').appendChild(messageElement);
            scrollMessagesToBottom();
        }

        // Scroll messages to the bottom
        function scrollMessagesToBottom() {
            const messagesContainer = document.querySelector('.messages-container');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Ensure messages are scrolled to the bottom on new message
        const messagesContainer = document.getElementById('messages');
        const observer = new MutationObserver(() => {
            scrollMessagesToBottom();
        });
        observer.observe(messagesContainer, { childList: true });

        // Scroll messages to the bottom initially
        scrollMessagesToBottom();

        // Adjust height on virtual keyboard open
        window.visualViewport.addEventListener('resize', () => {
            const height = window.visualViewport.height;
            document.body.style.height = `${height}px`;
            document.querySelector('.content').style.height = `${height}px`;
        });
    </script>

    <div class="footer hide-on-mobile">
        <a href="about.html" class="text-blue-500 underline">About Us</a>
        <a href="privacy.html" class="text-blue-500 underline ml-4">Privacy Policy</a>
        <a href="terms.html" class="text-blue-500 underline ml-4">Terms of Service</a>
    </div>

</body>
</html>
